name: .NET CI
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - treetest2
  pull_request:
    branches:
      - main
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
  DOTNET_NOLOGO: 'true'
jobs:
  build:
    name: Build
    runs-on: shared-runner
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
    - name: Build
      run: dotnet build -bl
    - uses: actions/upload-artifact@v3.2.2-node20
      with:
        name: build_log
        retention-days: 1
        path: |
          **/*.binlog

  deploy:
    name: Deploy
    needs: build
    if: github.ref == 'refs/heads/treetest2' && success()
    runs-on: shared-runner
    steps:
    - name: set version
      run: |
        echo "VERSION=9.1.2-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
    - name: Build
      run: dotnet build --configuration Release /p:Version="${VERSION}"
    - name: Pack
      run: dotnet pack --configuration Release /p:Version="${VERSION}" --no-build --output ./pack
    - name: Publish
      env:
        NUGET_AUTH_TOKEN: ${{ secrets.GHCR_TOKEN }}
      run: >-
        dotnet nuget push "./pack/*.nupkg"
        --source "https://nuget.pkg.github.com/${GITHUB_REPOSITORY_OWNER}/index.json"
        --api-key "$NUGET_AUTH_TOKEN"
        --skip-duplicate