name: .NET CI
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - treetest2
  pull_request:
    branches:
      - main
env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
jobs:
  build:
    name: Build
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: |
          8.0.x
    - name: Build
      run: dotnet build -bl
    - uses: actions/upload-artifact@v4
      with:
        name: build_log_${{ matrix.os }}
        retention-days: 1
        path: |
          **/*.binlog

  deploy:
    name: Deploy
    if: github.ref == 'refs/heads/treetest2' && success()
    runs-on: ubuntu-latest
    steps:
    - name: set version
      run: |
        SHA=${{ github.sha }}
        echo "VERSION=9.1.2-${SHA::7}" >> $GITHUB_ENV
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: |
          8.0.x
    - name: Build
      run: dotnet build --configuration Release /p:Version=${VERSION}
    - name: Pack
      run: dotnet pack --configuration Release /p:Version=${VERSION} --no-build --output ./pack
    - name: Publish
      run: dotnet nuget push ./pack/*.nupkg --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json --api-key ${{ secrets.GITHUB_TOKEN }}